    <title>Warp Jumper</title>
    <script>
      /**
       * Safe Object.defineProperty polyfill & error interceptor for Web3 browser extensions.
       * Fixes collisions between multi-wallet extensions (e.g. Zerion, Rabby, MetaMask, Coinbase)
       * attempting to redefine non-configurable properties like window.ethereum.isZerion.
       */
      (function () {
        var originalDefineProperty = Object.defineProperty;
        Object.defineProperty = function (obj, prop, descriptor) {
          try {
            return originalDefineProperty.call(Object, obj, prop, descriptor);
          } catch (err) {
            if (
              err instanceof TypeError &&
              err.message &&
              err.message.indexOf('Cannot redefine property') !== -1
            ) {
              try {
                if (descriptor && 'value' in descriptor) {
                  obj[prop] = descriptor.value;
                }
              } catch (_) {}
              return obj;
            }
            throw err;
          }
        };

        // Suppress uncaught wallet extension errors from bubbling and tripping error screens
        window.addEventListener(
          'error',
          function (event) {
            var src = (event && event.filename) || '';
            var msg = (event && event.message) || '';
            if (
              src.indexOf('chrome-extension://') !== -1 ||
              src.indexOf('moz-extension://') !== -1 ||
              msg.indexOf('Cannot redefine property') !== -1 ||
              msg.indexOf('isZerion') !== -1
            ) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = (reason && reason.message) || String(reason || '');
            if (
              msg.indexOf('Cannot redefine property') !== -1 ||
              msg.indexOf('isZerion') !== -1 ||
              msg.indexOf('chrome-extension://') !== -1
            ) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          },
          true
        );
      })();
    </script>
